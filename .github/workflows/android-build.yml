name: android-build

# dsh-android 构建流水线
# v0.1.0-m0.2 · 2026-08-27
#
# 双架构矩阵（arm64-v8a 真机 / x86_64 模拟器）：
#   collect-runtime —— 从 Termux 仓库收集对应架构 node 运行时 → runtime.zip
#   build-apk       —— 注入 runtime.zip 进 assets → gradle -Pabi=... 出 APK
#   release         —— tag 触发时双架构 APK 一并发布
#
# 注意：collect-runtime 脚本包名已对照 Termux Packages 索引核实过。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Release 上传需要

jobs:
  collect-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
          - termux_arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 局域网选址逻辑回归测试：必须跑在打补丁之前 —— 选址错了（例如把 VPN 的
      # tun0 地址当局域网地址显示）装机后才看得出来，而构建全绿。
      # 测试直接执行补丁产物里注入的那段 JS，不重复实现逻辑。
      - name: 校验局域网地址挑选逻辑
        run: node scripts/test-lan-pick.js

      # overlay 是运行时才生成的 YAML，一个丢掉的换行就会让引擎起不来，
      # 而编译期完全看不出来（原始字符串里少个换行仍是合法 Kotlin）。
      # 实测事故：v1.3.7 因此无限重启。
      - name: 校验 android-overlay.yml 能解析
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/test-android-overlay.py

      - name: 收集 Termux Node 运行时（${{ matrix.termux_arch }}）
        run: |
          sudo apt-get update -qq
          # binutils：collect 阶段末尾的 trim-runtime-libs.py 需要 readelf
          sudo apt-get install -y -qq apt dpkg-dev zip binutils
          chmod +x scripts/collect-termux-runtime.sh
          ./scripts/collect-termux-runtime.sh runtime.zip ${{ matrix.termux_arch }}

      - name: 校验运行时命令闭包（${{ matrix.abi }}）
        run: |
          rm -rf runtime-check && mkdir runtime-check
          unzip -q runtime.zip -d runtime-check
          test -x runtime-check/bin/bash
          test -x runtime-check/bin/rg
          # SONAME 精确文件名（Android linker 按 NEEDED 逐字查找）
          for so in libreadline.so.8 libhistory.so.8 libncursesw.so.6 libncurses.so.6 \
                    libiconv.so libpcre2-8.so; do
            test -e "runtime-check/lib/$so" || { echo "::error::SONAME 库 lib/$so 缺失"; exit 1; }
          done
          # 工具 wrapper（m1.6.8 真机验证版）
          test -x runtime-check/bin/pnpm
          test -x runtime-check/bin/curl
          test -e runtime-check/usr/bin/.keep
          # ripgrep 平台包（android resolver 的 require.resolve 目标）
          case "${{ matrix.termux_arch }}" in
            aarch64) NA=arm64 ;; x86_64) NA=x64 ;;
          esac
          test -x "runtime-check/lib/node_modules/@vscode/ripgrep-android-$NA/bin/rg" \
            || { echo "::error::ripgrep 平台包缺失"; exit 1; }
          if find runtime-check -type f -path '*@vscode/ripgrep-linux-*/*/rg' -print -quit | grep -q .; then
            echo "::error::runtime 混入宿主 Linux ripgrep"
            exit 1
          fi
          echo "bash/rg/SONAME/wrapper runtime closure OK"

      - name: 计算校验值
        id: meta
        run: |
          echo "sha256=$(sha256sum runtime.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s runtime.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: runtime.zip
          retention-days: 1

  build-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
          - termux_arch: x86_64
            abi: x86_64
    runs-on: ubuntu-24.04
    needs: [collect-runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: .

      - name: 注入 runtime.zip 到 assets
        run: mv runtime.zip app/src/main/assets/runtime.zip

      # 构建期断言：局域网补丁必须真的进了 runtime.zip。
      # 这类"补丁静默没生效"的问题在装机前查不出来（构建全绿、APK 正常、就是不能连），
      # 所以在这里用产物级 grep 拦下。
      - name: 校验局域网补丁已进入 runtime
        run: |
          unzip -p app/src/main/assets/runtime.zip \
            'lib/node_modules/@deepseek-ai/dsh-web-app/cordis.patch.yml' > /tmp/ws.yml
          # webserver 的 host 必须变成受 DSH_LAN_ACCESS 控制的三元表达式
          if grep -q "host: !!js \"process.env.DSH_LAN_ACCESS === '1'" /tmp/ws.yml; then
            echo "OK: webserver bind host 受 DSH_LAN_ACCESS 控制"
          else
            echo "::error::webserver bind host 未被局域网补丁改写 —— 局域网访问不可用"
            grep -n "host:" /tmp/ws.yml | head -5
            exit 1
          fi
          # 关闭态必须仍然回落到回环（默认安全），否则等于把开关焊死成常开
          grep -q "ctx.webStartup.host ?? '127.0.0.1'" /tmp/ws.yml \
            || { echo "::error::开关关闭时未回落到 127.0.0.1（默认不再是仅本机）"; exit 1; }
          unzip -p app/src/main/assets/runtime.zip \
            'lib/node_modules/@deepseek-ai/dsh-web-app/lib/index.js' > /tmp/wa.js
          # 局域网地址日志行必须存在，且必须同样受开关控制
          grep -q "dsh web: lan url:" /tmp/wa.js \
            || { echo "::error::局域网地址日志行缺失"; exit 1; }
          grep -q 'process.env.DSH_LAN_ACCESS === "1"' /tmp/wa.js \
            || { echo "::error::局域网地址日志行未受开关控制"; exit 1; }
          grep -q "\[dsh-android-lan\]" /tmp/wa.js \
            || { echo "::error::补丁标记缺失"; exit 1; }
          node --check /tmp/wa.js \
            || { echo "::error::注入后的 dsh-web-app/lib/index.js 语法错误"; exit 1; }
          # 免 token 补丁：两处认证闸门必须都已 gated（默认关，不设环境变量即上游行为）
          unzip -p app/src/main/assets/runtime.zip \
            'lib/node_modules/@deepseek-ai/dsh-client-connection/lib/index.js' > /tmp/wc.js
          grep -q 'DSH_LAN_NO_AUTH === "1") return true;' /tmp/wc.js \
            || { echo "::error::首屏认证闸门未被免 token 补丁改写"; exit 1; }
          grep -q 'DSH_LAN_NO_AUTH === "1") return void 0;' /tmp/wc.js \
            || { echo "::error::/api 认证闸门未被免 token 补丁改写"; exit 1; }
          grep -q 'isTrustedApiRequest(request, this.trustedHosts)) return 403' /tmp/wc.js \
            || { echo "::error::Host/Origin 栅栏被误删"; exit 1; }
          node --check /tmp/wc.js \
            || { echo "::error::注入后的 dsh-client-connection/lib/index.js 语法错误"; exit 1; }
          # 浏览器端：局域网地址必须能读写设置（上游按 isLoopback 降级为内存模式）
          unzip -p app/src/main/assets/runtime.zip \
            'lib/node_modules/@deepseek-ai/dsh-client-connection/lib/client.js' > /tmp/wcl.js
          grep -q 'a === 192 && b === 168' /tmp/wcl.js \
            || { echo "::error::客户端 isLoopbackHostname 未放行私有网段 —— 局域网设备改不了模型供应商"; exit 1; }
          grep -q 'if (a === 127) return true;' /tmp/wcl.js \
            || { echo "::error::客户端环回判定被破坏"; exit 1; }
          node --check /tmp/wcl.js \
            || { echo "::error::注入后的 dsh-client-connection/lib/client.js 语法错误"; exit 1; }
          # 默认思考档位补丁：必须真的进了 runtime.zip，且行为正确
          unzip -p app/src/main/assets/runtime.zip \
            'lib/node_modules/@deepseek-ai/dsh-llm-pi-ai/lib/index.js' > /tmp/wr.js
          grep -q 'DSH_DEFAULT_REASONING' /tmp/wr.js \
            || { echo "::error::默认思考档位补丁未进入 runtime（自定义模型将没有思考强度选择）"; exit 1; }
          node --check /tmp/wr.js \
            || { echo "::error::注入后的 dsh-llm-pi-ai/lib/index.js 语法错误"; exit 1; }
          node scripts/test-reasoning-default.js /tmp/wr.js \
            || { echo "::error::默认思考档位行为不符合预期"; exit 1; }
          echo "局域网补丁校验通过（host 受控 + 关闭回落回环 + lan url 日志 + 免 token 双闸门 + 设置可写 + 思考档位 + JS 语法）"

      - name: 回填 MANIFEST 版本与校验值
        run: |
          SHA=$(sha256sum app/src/main/assets/runtime.zip | cut -d' ' -f1)
          # pull_request 时 GITHUB_REF_NAME 为 "1/merge"，含斜杠会污染版本串与文件名
          REF="${GITHUB_REF_NAME//\//-}"
          VER="${REF:-dev}-$(date +%Y%m%d)"
          jq --arg sha "$SHA" --arg ver "$VER" \
            '.version=$ver | .sha256=$sha' \
            app/src/main/assets/runtime/MANIFEST.json > /tmp/m.json
          mv /tmp/m.json app/src/main/assets/runtime/MANIFEST.json

      # 内置插件：dsh-prompt-polish（输入框旁的「✨ 润色」按钮）。
      # 与运行时一样从 npm 取固定版本、按 sha256 校验后铺进 assets —— 二进制不进仓库。
      # ⚠️ 该插件是 AGPL-3.0（本项目 MIT）：它作为独立模块随包分发，不修改其源码，
      #    LICENSE 原样保留在包内；发布说明里也标了这一点。
      - name: 准备内置插件（dsh-prompt-polish）
        run: |
          curl -fsSL -o /tmp/pp.tgz \
            "https://registry.npmjs.org/@benrong/dsh-prompt-polish/-/dsh-prompt-polish-0.2.3.tgz"
          echo "8c60b4a827c51a1b17f9ce09c677c3ded16eb8d39a45064a0d30fe911588d930  /tmp/pp.tgz" \
            | sha256sum -c - \
            || { echo "::error::插件包校验失败（上游可能改了同版本的内容）"; exit 1; }
          rm -rf /tmp/ppx app/src/main/assets/plugins/dsh-prompt-polish
          mkdir -p /tmp/ppx app/src/main/assets/plugins/dsh-prompt-polish
          tar xzf /tmp/pp.tgz -C /tmp/ppx
          cp -a /tmp/ppx/package/. app/src/main/assets/plugins/dsh-prompt-polish/
          test -f app/src/main/assets/plugins/dsh-prompt-polish/lib/client.js \
            || { echo "::error::插件文件缺失"; exit 1; }
          test -f app/src/main/assets/plugins/dsh-prompt-polish/LICENSE \
            || { echo "::error::插件 LICENSE 缺失（AGPL 要求保留）"; exit 1; }
          # 生成确定性的文件清单：App 侧按清单逐个 open() 复制。
          # 不用 AssetManager.list() 递归 —— 实测它在目录形态下返回空，
          # 会导致安装器误判"本构建未内置该插件"而静默跳过。
          cd app/src/main/assets/plugins/dsh-prompt-polish
          find . -type f ! -name FILELIST.txt | sed 's|^\./||' | sort > FILELIST.txt
          cd - > /dev/null
          echo "插件就绪：$(du -sh app/src/main/assets/plugins/dsh-prompt-polish | cut -f1)，$(wc -l < app/src/main/assets/plugins/dsh-prompt-polish/FILELIST.txt) 个文件"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不含 gradle-wrapper.jar（二进制不入库），用 setup-gradle 直接提供 gradle 命令
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 构建 APK（${{ matrix.abi }}）
        env:
          # 固定签名密钥（GitHub Secrets）；缺失时回落到 AGP 默认 debug 签名。
          # 没有它，每次构建都会生成新密钥 → 装新版报"签名不一致"。
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p . assembleDebug -Pabi=${{ matrix.abi }} --stacktrace

      # 断言签名确实是那把固定密钥：签名随构建变化会让用户被迫卸载重装，
      # 而"构建全绿 + APK 正常 + 就是装不上"在装机前看不出来。
      - name: 校验 APK 签名与固定密钥一致
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置签名 secret，本次 APK 使用随机 debug 签名（用户需卸载重装）"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > /tmp/verify-ks.jks
          # keytool 输出 SHA256:AB:CD:…，apksigner 输出小写无分隔 —— 统一后再比
          CERT=$(keytool -list -v -keystore /tmp/verify-ks.jks -storepass "$KS_PW" 2>/dev/null \
                 | grep 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APK_CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                 | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "keystore: $CERT"
          echo "apk     : $APK_CERT"
          test -n "$CERT" && test "$CERT" = "$APK_CERT" \
            || { echo "::error::APK 签名与固定密钥不一致 —— 用户将无法覆盖安装"; exit 1; }
          echo "签名一致 ✓"

      # 防呆自检：真机 16KB 页内核上 p_align=4096 的 so 会 dlopen 失败
      # （v0.1.0-m1 真机「卡在启动中」事故根因）。所有 LOAD 段必须 >=16384。
      - name: 校验 so 16KB 页对齐（${{ matrix.abi }}）
        run: |
          mkdir -p chk && cd chk
          unzip -o ../app/build/outputs/apk/debug/app-debug.apk 'lib/*.so' >/dev/null
          FAIL=0
          # 注意：readelf -lW 的 Align 列是 16 进制（如 0x4000），必须显式转十进制
          for so in $(find lib -name '*.so'); do
            BAD=$(readelf -lW "$so" \
              | awk '/LOAD/{v=$NF; if (v ~ /^0[xX]/){("printf %d " v) | getline n; close("printf %d " v)} else n=v+0; if (n+0 < 16384) print FILENAME": align="v}' \
              | head -3)
            if [ -n "$BAD" ]; then
              echo "::error file=$so::LOAD 段对齐 <16384：$BAD"
              FAIL=1
            else
              echo "OK $so"
            fi
          done
          exit $FAIL

      # Gradle 对所有 ABI 都输出同名 app-debug.apk；
      # 必须在产物级先重命名，否则 release merge 时后传者覆盖先传者
      - name: 按版本+架构重命名 APK
        run: |
          mkdir -p dist
          # 同上：PR 上 GITHUB_REF_NAME="1/merge"，斜杠会让 cp 写进不存在的子目录
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/dsh-android-${GITHUB_REF_NAME//\//-}-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug-apk-${{ matrix.abi }}
          path: dist/*.apk
          retention-days: 1   # 仅 job 间传递用，避免 90 天默认堆积百 MB×N（曾堆 32GB）

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build-apk]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-debug-apk-*
          merge-multiple: true
          path: apk/

      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
